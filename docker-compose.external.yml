services:
  webhook-bot:
    image: hteppl/remnawave-webhook-bot:latest
    container_name: remnawave-webhook-bot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - remnawave-webhook-bot
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('WEBHOOK_PORT', '8089'))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  remnawave-webhook-bot:
    name: remnawave-webhook-bot

[project]
name = "remnawave-webhook-bot"
version = "1.2.0"
description = "Telegram webhook notifications bot for Remnawave panel"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.30.0",
    "fluent.compiler==1.1",
    "aiohttp==3.14.3",
    "python-dotenv==1.2.3",
    "user-agents==2.2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "FURB"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
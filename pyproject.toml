[project]
name = "remnawave-webhook-bot"
version = "1.1.0"
description = "Telegram webhook notifications bot for Remnawave panel"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.22.0",
    "aiogram-i18n==1.4",
    "fluent.runtime==0.4.0",
    "aiohttp==3.13.2",
    "python-dotenv==1.2.1",
    "user-agents==2.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
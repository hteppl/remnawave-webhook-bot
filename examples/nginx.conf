# Пример для отдельного сервера (docker-compose.external.yml).
# При установке рядом с панелью Remnawave реверс прокси не требуется:
# панель обращается к контейнеру напрямую по адресу http://remnawave-webhook-bot:8089.
#
# Порт наружу не публикуется. nginx должен быть запущен в Docker и подключен
# к сети remnawave-webhook-bot.

server {
    listen 443 ssl;
    http2 on;
    server_name webhook.your_address.com;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://remnawave-webhook-bot:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Remnawave-Signature $http_x_remnawave_signature;
        proxy_set_header X-Remnawave-Timestamp $http_x_remnawave_timestamp;
    }
}
